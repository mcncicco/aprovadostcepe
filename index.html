<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação de Acesso</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Obter link de acesso Aprovados TCE PE</h1>
      <p class="subtitle">Valide seu nome e data de nascimento</p>

      <form id="formulario" class="card">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" placeholder="Digite o nome" required />

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" required />

        <button type="submit">Verificar</button>
      </form>

      <div id="resultado" class="resultado" aria-live="polite"></div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
