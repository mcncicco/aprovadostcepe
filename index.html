<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validação de Acesso</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <div class="brand" aria-label="Logo do TCE PE">
        <svg class="brand-mark" viewBox="0 0 180 90" role="img" aria-label="TCE PE logo">
          <circle cx="40" cy="45" r="32" fill="#f4c542" />
          <path d="M40 13 A32 32 0 0 1 70 45 L40 45 Z" fill="#1f6fd0" />
          <path d="M40 13 A32 32 0 0 1 40 77 L40 45 Z" fill="#ef4444" />
          <path d="M40 77 A32 32 0 0 1 10 45 L40 45 Z" fill="#22c55e" />
          <path d="M10 45 A32 32 0 0 1 40 13 L40 45 Z" fill="#f97316" />
          <circle cx="40" cy="45" r="12" fill="#f5f5f5" />
          <circle cx="40" cy="45" r="6" fill="#f4c542" />
          <path d="M68 18 L78 18 L78 72 L68 72 Z" fill="#1f2937" opacity="0.8" />
          <path d="M85 18 L155 18 L155 26 L85 26 Z" fill="#1f2937" opacity="0.8" />
          <path d="M85 40 L149 40 L149 48 L85 48 Z" fill="#1f2937" opacity="0.8" />
          <path d="M85 62 L136 62 L136 70 L85 70 Z" fill="#1f2937" opacity="0.8" />
          <text x="100" y="58" font-size="28" font-weight="700" fill="#1f2937" font-family="Arial, Helvetica, sans-serif">TCEPE</text>
        </svg>
      </div>

      <h1>Obter link de acesso Aprovados TCE PE</h1>
      <p class="subtitle">Valide seu nome e data de nascimento</p>

      <form id="formulario" class="card">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" placeholder="Digite o nome" required />

        <label for="nascimento">Data de nascimento</label>
        <input id="nascimento" name="nascimento" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" required />

        <button type="submit">Verificar</button>
      </form>

      <div id="resultado" class="resultado" aria-live="polite"></div>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
